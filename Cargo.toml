[package]
name = "appytui"
version = "0.5.0"
edition = "2024"
description = "Apple Music TUI with a cava-style visualizer"
license = "MIT"
repository = "https://github.com/roma-888/appytui"
readme = "README.md"
keywords = ["apple-music", "tui", "visualizer", "ratatui", "macos"]
categories = ["command-line-utilities", "multimedia::audio"]

[dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
dirs = "6"
crossbeam-channel = "0.5"
ratatui = "0.30"
nucleo-matcher = "0.3"
rustfft = "6"
ringbuf = "0.4"
ureq = { version = "3", features = ["json"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
ratatui-image = { version = "11", default-features = false, features = ["crossterm"] }

[target.'cfg(target_os = "macos")'.dependencies]
cidre = { version = "0.24", default-features = false, features = ["core_audio", "macos_14_2"] }

[profile.release]
lto = true
codegen-units = 1
